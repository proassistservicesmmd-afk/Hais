name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --user buildozer cython==0.29.36 kivy

      - name: Build with Buildozer
        run: |
          cd $GITHUB_WORKSPACE
          buildozer init
          sed -i 's/package.name = myapp/package.name = humanityaishield/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.humanity/g' buildozer.spec
          sed -i 's/title = My Application/title = Humanity AI Shield V7/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests/' buildozer.spec
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAIS-APK
          path: bin/*.apk

